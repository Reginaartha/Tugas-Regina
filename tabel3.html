<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Membuat Tabel 3 HTML</title>
</head>
<body>
    <table border="1" cellpadding="10" cellspacing="10">
        <tr>
            <th rowspan="2" bgcolor="pink">Bulan</th>
            <th colspan="2" bgcolor="blue">Penjualan</th>
        </tr>

        <tr>
            <th>Produk A</th>
            <th>Produk B</th>
        </tr>

        <tr>
            <td bgcolor="pink">Januari</td>
            <td>100</td>
            <td>150</td>
        </tr>

        <tr>
            <td bgcolor="pink">Februari</td>
            <td>120</td>
            <td>180</td>
        </tr>
    </table>
</body>
</html>
