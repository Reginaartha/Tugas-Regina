<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Form 2</title>
</head>
<body>
    <fieldset>
       <center>
         <h2>FORM BIODATA SISWA</h2>
      </center>
      <hr
    
    <form>
        NIM: <input type="text" name="nim">
        <br><br>

        Nama Lengkap: <input type="text" name="nama_lengkap">
        <br><br>

        Kelas: <select name="kelas">
            <option value="X">X</option>
            <option value="XI">XI</option>
            <option value="XII">XII</option>
        </select>
        <br><br>    

        Jurusan: <input type="radio" name="jurusan" value="teknik_informatika"> Teknik Informatika
        <input type="radio" name="jurusan" value="sistem_informasi"> Sistem Informasi
        <input type="radio" name="jurusan" value="multimedia"> Multimedia
        <br><br>

        Tempat dan Tanggal Lahir: <input type="text">
         <select name="tanggal">
           <option value="tanggal">Tanggal</option>
            <option value="1">1</option>
            <option value="2">2</option>    
            <option value="3">3</option>
            <option value="4">4</option>    
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
            <option value="11">11</option>
            <option value="12">12</option>      
            <option value="13">13</option>
            <option value="14">14</option>
            <option value="15">15</option>
            <option value="16">16</option>
            <option value="17">17</option>
            <option value="18">18</option>
            <option value="19">19</option>
            <option value="20">20</option>
            <option value="21">21</option>
            <option value="22">22</option>
            <option value="23">23</option>
            <option value="24">24</option>      
            <option value="25">25</option>
            <option value="26">26</option>
            <option value="27">27</option>
            <option value="28">28</option>
            <option value="29">29</option>
            <option value="30">30</option> 
            <option value="31">31</option>
        </select>
        <select name="bulan">
           <option value="bulan">Bulan</option>
            <option value="januari">Januari</option>
            <option value="februari">Februari</option>
            <option value="maret">Maret</option>
            <option value="april">April</option>
            <option value="mei">Mei</option>
            <option value="juni">Juni</option>
            <option value="juli">Juli</option>
            <option value="agustus">Agustus</option>
            <option value="september">September</option>
            <option value="oktober">Oktober</option>
            <option value="november">November</option>
            <option value="desember">Desember</option>
        </select>
        <select name="tahun">
           <option value="tahun">Tahun</option>
            <option value="2000">2000</option>
            <option value="2001">2001</option>
            <option value="2002">2002</option>
            <option value="2003">2003</option>
            <option value="2004">2004</option>
            <option value="2005">2005</option>
            <option value="2006">2006</option>
            <option value="2007">2007</option>
            <option value="2008">2008</option>
            <option value="2009">2009</option>
            <option value="2010">2010</option>
        </select>
        <br><br>

        Jenis Kelamin: <input type="radio" name="gender" value="laki-laki"> Laki-laki
        <input type="radio" name="gender" value="perempuan"> Perempuan
        <br><br>    

        Alamat: <textarea name="alamat"></textarea>
        <br><br>

        Email: <input type="email" name="email">
        @ <select name="domain">
            <option value="gmail.com">gmail.com</option>
            <option value="yahoo.com">yahoo.com</option>
            <option value="outlook.com">outlook.com</option>
        </select>
        <br><br>
        
    </form>
        <input type="submit" value="Submit">
        <input type="reset" value="Cancel">
        <br><br>
    </fieldset>
</body>
</html>
