<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Form 1</title>
</head>
<body>
    <p>INI YANG PERTAMA</p>
         <h1>Form Pendaftaran</h1>
    <form>
         Nama: <input type="text">
         <br><br>
         Email: <input type="email">
         <br><br>
         Umur: <input type="number">
         <br><br>
         Tanggal Lahir: <input type="date">
         <br><br>
         Jenis Kelamin: <input type="radio" name="gender" value="Laki-laki"> Laki-laki
         <input type="radio" name="gender" value="Perempuan"> Perempuan
         <br><br>
         Alamat: <textarea></textarea>


    </form>

    <h2>Data Siswa</h2>
    <label for="nama">Nama:</label>
    <input type="text" id="nama" name="nama">
    <br><br>
    <label for="email">Email:</label>
    <input type="email" id="email" name="email">
    <br><br>
    <label for="umur">Umur:</label>
    <input type="number" id="umur" name="umur">
    <br><br>
    <label for="tanggal_lahir">Tanggal Lahir:</label>
    <input type="date" id="tanggal_lahir" name="tanggal_lahir">
    <br><br
    <label for="gender">Jenis Kelamin:</label>
    <input type="radio" id="laki-laki" name="gender" value="Laki-laki">
    <label for="laki-laki">Laki-laki</label>
    <input type="radio" id="perempuan" name="gender" value="Perempuan">
    <label for="perempuan">Perempuan</label>
    <br><br>
    <label for="alamat">Alamat:</label>
    <textarea id="alamat" name="alamat"></textarea> 




</body>
</html>
