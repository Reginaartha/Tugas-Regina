<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabel Luas Perkebunan</title>
</head>
<body>
    <table border="1" cellpadding="10" cellspacing="5">
        <tr>
            <th rowspan="1" bgcolor="pink">Jenis Perkebunan</th>
            <th colspan="4" bgcolor="pink">Luas Tanah</th>
        </tr>
        
        <tr>
            <td bgcolor="lightBlue">Kopi</td>
            <td>21 Hektar</td>
            <td>36 Hektar</td>
            <td>45 Hektar</td>
            <td>54 Hektar</td>
        </tr>

        <tr>
            <td bgcolor="lightBlue">Kelapa Sawit</td>
            <td>30 Hektar</td>
            <td>27 Hektar</td>
            <td>31 Hektar</td>
            <td>20 Hektar</td>
        </tr>

        <tr>
            <th colspan="1" bgcolor="pink">Total Produksi</th>
            <th colspan="2" bgcolor="pink">Besaran Panen Bulanan</th>
            <th colspan="2" bgcolor="pink">Besaran Panen Tahunan</th>
        </tr>

        <tr>
            <td bgcolor="lightblue">Kelapa sawit</td>
            <td colspan="2">200 Ton</td>
            <td colspan="2">450 Ton</td>
        </tr>
    </table>
</body>
</html>
